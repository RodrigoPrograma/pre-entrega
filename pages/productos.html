<html lang="en">
  <head>

  <body>
    <header>
      <a class="logo" href="./index.html"><img src="../img/Icono panaderia.png" alt="Logo Panadería"></a>
        <nav class="header-nav">
            <ul class="main-nav list-unstyled">
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./productos.html">Productos</a></li>
          <li><a href="./resenas.html">Reseñas</a></li>

      </nav>

    <main>
<section class="w-100">
            <section class="d-flex flex-column gap-2 hero w-100">
            <div ></div>
            <div>

                <h1 class>Productos</h1>
                
                <p>
                    Lo que opinan nuestros clientes
                </p>
                <br>
            </section>
            <h2 class="titulo-productos text-secondary">Nuestros productos</h2>
            <div class="d-grid">
                <article class="card ">
                    <img src="../img/budin.jpg" alt="imagen de un budin" />
                    <h3>Budin de limon</h3>
                    <p>Budin glaseado</p>
                    <p>$5000</p>
                    <button class="btn bg-primary border-radius">
                        Agregar al carrito
                    </button>
                </article>

                <article class="card ">
                    <img src="../img/croissant.jpg" alt="imagen croissant" />
                    <h3>Croissant</h3>
                    <p>Croissant crocante</p>
                    <p>$1333</p>
                    <button class="btn bg-primary border-radius">
                        Agregar al carrito
                    </button>
                </article>

                <article class="card ">
                    <img src="../img/pancakes.jpg" alt="imagen pancake" />
                    <h3>Pancake</h3>
                    <p>Descripcion de un pancake</p>
                    <p>$25000</p>
                    <button class="btn bg-primary border-radius">
                        Agregar al carrito
                    </button>
                </article>

                <article class="card ">
                    <img src="../img/pan.jpg" alt="imagen de un pan casero" />
                    <h3>Pan casero</h3>
                    <p>Pan de masa madre</p>
                    <p>$3000</p>
                    <button class="btn bg-primary border-radius">
                        Agregar al carrito
                    </button>
                </article>
            </div>
        </section>
